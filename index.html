<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SBW HUD Renderer</title>
  <style>
    body {
      background-color: #000;
      color: #0ff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
    }
    #signal-box {
      background: #111;
      border: 2px solid #0ff;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
    }
    .ticker-card {
      background: #111;
      border: 1px solid #0ff;
      padding: 10px;
      margin: 5px;
      border-radius: 4px;
      width: 280px;
    }
    .toggle-panel {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .toggle-btn {
      padding: 10px 15px;
      background: #0ff;
      color: #000;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
<script>
  async function loadBreakoutTickers() {
    try {
      const response = await fetch('breakouts.json');
      const data = await response.json();
      const signalBox = document.getElementById('signal-box');

      data.forEach(ticker => {
        const card = document.createElement('div');
        card.style.margin = '10px 0';
        card.style.padding = '10px';
        card.style.background = '#222';
        card.style.border = '1px solid #0ff';
        card.style.borderRadius = '6px';

        card.innerHTML = `
          <strong>${ticker.symbol}</strong><br/>
          💰 Price: $${ticker.price}<br/>
          🚨 Status: ${ticker.status}
        `;

        signalBox.appendChild(card);
      });
    } catch (error) {
      console.error('Error loading breakout tickers:', error);
    }
  }

  window.onload = loadBreakoutTickers;
</script>
</head>
<body>
  <h1>SBW Mutation HUD</h1>
  <div id="signal-box">🔄 Waiting for breakout signal...</div>
  <div id="ticker-deck"></div>  <div class="toggle-panel">
    <button class="toggle-btn">Watch Mode</button>
    <button class="toggle-btn">Echo Trail</button>
    <button class="toggle-btn">Mutation Crown</button>
    <button class="toggle-btn">Shorts Trigger</button>
  </div>  <script>
    async function fetchBreakoutData() {
      try {
        const response = await fetch('/api/breakout-tickers');
        const data = await response.json();
        document.getElementById('signal-box').textContent = '🚀 Breakout Detected';

        const deck = document.getElementById('ticker-deck');
        deck.innerHTML = '';
        data.forEach(ticker => {
          const card = document.createElement('div');
          card.className = 'ticker-card';
          card.innerHTML = `<strong>${ticker.symbol}</strong><br>Price: $${ticker.price}<br>Status: ${ticker.status}`;
          deck.appendChild(card);
        });
      } catch (err) {
        document.getElementById('signal-box').textContent = '⚠️ Error loading data';
      }
    }

    // Call fetch initially and every 15 seconds
    fetchBreakoutData();
    setInterval(fetchBreakoutData, 15000);
  </script></body>
</html>
